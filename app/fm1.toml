# Erik37's build settings (fm1-base's tools/build.py: ./build.sh)
name = "ERIK37"                # the build's files: erik37-smk37.fwsc
id_prefix = "FM-1_4801"        # package identity family _4801xx: the FM-1 build FM-1_4801 + id_suffix
smk_id_prefix = "4801"         # the SMK-37: SMK-37 Pro_4801 + id_suffix (four digits keep the Elite's name within 20)
id_suffix = "01"               # 1.0 was _480100, 1.1 is _480101 (SMK-37 Pro_480101, FM-1_480101)
usb_manufacturer = "erik37"
usb_product = "ERIK37"
words = "words.tsv"
ble = false
o2 = ["dsp/erk.c"]             # the piano engine at -O2 (the unity build is -Os)
device_include = ["dsp/compat"]   # <string.h> for the engine unit: the toolchain has no C library headers
gen = ["tools/gen_assets.py {gen}"]
# the site (fm1-base tools/make_site.py, tools/publish_site.sh)
tagline = "a grand piano for the SMK-37"
repo = "https://github.com/genkigenki/erik37"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp. The piano is the Salamander Grand Piano V3 by Alexander Holm (CC BY 3.0)."
